name: autopatch
description: >-
  Rebase a personal fork's default branch onto upstream with AI agents resolving conflicts and a
  second agent from another provider reviewing until both agree. Force-pushes with backup refs.
author: Matt Olenik
branding:
  icon: git-branch
  color: purple

inputs:
  phase:
    description: prepare exports a candidate; verify checks it in a fresh job; publish updates refs; report files a failure issue.
    default: prepare
  artifact_dir:
    description: Downloaded candidate artifact directory (verify/publish), or results directory (report).
  candidate_digest:
    description: SHA-256 from the prepare job's artifact_digest output.
  verification_dir:
    description: Downloaded verification artifact directory (publish).
  verification_digest:
    description: SHA-256 from the verify job's artifact_digest output.
  results_digest:
    description: SHA-256 from the failed job's results_digest output (report).
  initial_base:
    description: Explicit merge-base SHA to initialize the first upstream checkpoint; without it the first candidate is staged.
  upstream_token:
    description: Optional read-only credential for a private upstream, scoped separately from the fork token.
  sandbox:
    description: Require Linux bubblewrap isolation for agents and verification. Disable only for trusted local tests.
    default: 'true'
  require_hard_limits:
    description: Reject backends without enforced turn and dollar limits (currently Codex).
    default: 'false'
  claude_version:
    description: Exact Claude Code version to install or require from a preinstalled binary.
    default: '2.1.288'
  codex_version:
    description: Exact Codex CLI version to install or require from a preinstalled binary.
    default: '0.160.0'
  rescue_branch:
    description: Published rescue branch from the publish job output (report phase only).
  upstream:
    description: Upstream repository as owner/repo or a full URL.
    required: true
  upstream_branch:
    description: Upstream branch to rebase onto. Defaults to upstream's default branch.
    required: false
  branch:
    description: Fork branch to maintain. Defaults to the fork's default branch.
    required: false
  repository:
    description: Fork repository as owner/repo. Defaults to the repository running the workflow.
    required: false
    default: ${{ github.repository }}
  token:
    description: >-
      Read-only token for prepare/verify. Publish/report jobs use a PAT or App token with Contents,
      Workflows, and Issues write. Never pass a publishing credential to prepare or verify.
    required: true
  worker:
    description: Worker agent as backend:model, e.g. claude:claude-opus-5-5 or codex:gpt-6.1-sol.
    required: false
  reviewer:
    description: Reviewer agent as backend:model. Use a different provider. Empty disables review.
    required: false
    default: ''
  max_rounds:
    description: Maximum consensus rounds before the result is treated as contested.
    required: false
    default: '3'
  verify_command:
    description: Shell command run by the orchestrator after the rebase and after every review fix.
    required: false
    default: ''
  max_patches:
    description: Fail if the fork carries more than this many patches over upstream.
    required: false
    default: '200'
  max_cost_usd:
    description: Reported-cost budget. Codex spend is unknown; require_hard_limits rejects unsupported backends.
    required: false
    default: '10'
  max_turns:
    description: Maximum Claude turns per invocation. Codex does not support this limit.
    required: false
    default: '60'
  agent_timeout_minutes:
    description: Wall-clock limit per agent invocation and verification command.
    required: false
    default: '30'
  keep_backups:
    description: Number of refs/autopatch/backup entries to keep.
    required: false
    default: '10'
  publish:
    description: auto force-pushes after approval; stage leaves the temporary branch for manual promotion.
    required: false
    default: auto
  install_clis:
    description: Install missing agent CLIs on the runner.
    required: false
    default: 'true'
  dry_run:
    description: Do everything except push.
    required: false
    default: 'false'
  anthropic_api_key:
    description: API key for the claude backend.
    required: false
    default: ''
  openai_api_key:
    description: API key for the codex backend.
    required: false
    default: ''
  fork_remote_url:
    description: Test-only override of the fork remote URL.
    required: false
    default: ''
  fake_script:
    description: Test-only path to a fake backend script.
    required: false
    default: ''

outputs:
  state:
    description: PREPARED, VERIFIED, STAGED, APPROVED, REPORTED, NOTHING_TO_DO, FAST_FORWARDED, or a FAILED_* value.
  branch_sha:
    description: SHA the branch points at after the run.
  backup_ref:
    description: Backup ref created before the force-push, if any.
  temp_branch:
    description: Temporary branch name, kept on failure.
  results_dir:
    description: Directory containing results.json, transcripts, and range-diff output.
  results_digest:
    description: SHA-256 of results.json, for a separate failure-reporting job.
  artifact_dir:
    description: Candidate or verification artifact directory to upload.
  artifact_digest:
    description: SHA-256 of the artifact manifest; pass through trusted job outputs.

runs:
  using: node24
  main: dist/index.js
