# Commit this as one of your fork's patches. Pin the reusable workflow to a reviewed release SHA.
name: autofork
on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:
    inputs:
      dry_run:
        type: boolean
        default: true
      initial_base:
        description: First run only; inspected merge-base SHA of the fork and upstream
        type: string
        default: ''

permissions:
  contents: read
  actions: read

jobs:
  sync:
    uses: mattolenik/gha-autofork/.github/workflows/autofork.yml@v1
    with:
      upstream: OWNER/REPO
      worker: claude:claude-opus-5-5
      reviewer: codex:gpt-6.1-sol
      verify_command: npm ci && npm test
      initial_base: ${{ inputs.initial_base || '' }}
      publish: auto
      dry_run: ${{ inputs.dry_run || false }}
    secrets:
      token: ${{ secrets.AUTOFORK_TOKEN }}
      anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
      openai_api_key: ${{ secrets.OPENAI_API_KEY }}
